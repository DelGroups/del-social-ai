name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: del_social_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      # Throwaway CI database; superuser so fixtures can seed across tenants.
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/del_social_test
      MIGRATION_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/del_social_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests (incl. tenant isolation)
        run: pytest -v

      - name: Migrations round-trip (downgrade → upgrade)
        run: |
          alembic downgrade base
          alembic upgrade head
