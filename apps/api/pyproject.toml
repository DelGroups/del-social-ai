[project]
name = "del-social"
version = "0.1.0"
description = "DEL SOCIAL AI — API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.4,<3",
    "asyncpg>=0.29,<1",
    "redis>=5,<7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["del_social*"]
