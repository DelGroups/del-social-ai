# DEL SOCIAL AI — Phase 0 stack
#
#   docker compose up -d --build     # postgres + redis + caddy + api + web
#
# All secrets come from .env (copy .env.example). Required vars fail fast.

name: del-social-ai

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Loopback only: reachable from the host for dev tools, never from the internet.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --appendonly
      - "yes"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      AI_DOMAIN: ${AI_DOMAIN:?AI_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # TLS certificates — must persist
      - caddy_config:/config
    networks: [frontend]
    logging: *default-logging

  # --- Application ---

  # Least privilege: the api gets only the variables it needs and connects as
  # the restricted del_app role, so Postgres RLS always applies (ADR 001).
  # It never receives the database owner's credentials.
  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      APP_BASE_URL: https://${APP_DOMAIN} # invitation and password-reset links point here
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL_FAST: ${CLAUDE_MODEL_FAST:-claude-haiku-4-5-20251001}
      CLAUDE_MODEL_DEFAULT: ${CLAUDE_MODEL_DEFAULT:-claude-sonnet-5}
      CLAUDE_MODEL_STRATEGY: ${CLAUDE_MODEL_STRATEGY:-claude-opus-5-5}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-del_app}:${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TOKEN_VAULT_KEY: ${TOKEN_VAULT_KEY:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      META_LOGIN_CONFIG_ID: ${META_LOGIN_CONFIG_ID:-}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [frontend, backend]
    logging: *default-logging

  # One-off jobs as the database owner:
  #   docker compose run --rm migrate                      (apply migrations)
  #   docker compose run --rm migrate python -m del_social.cli create-platform-admin --email ...
  migrate:
    profiles: ["tools"]
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    logging: *default-logging

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000 # server-side calls stay inside Docker
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend]
    logging: *default-logging

networks:
  frontend:
  backend: # data stores; caddy is not attached, so they are never proxied

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
