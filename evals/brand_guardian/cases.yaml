# Brand Guardian eval cases for Del Furniture (docs/phase-1-plan.md §10).
# expect: pass | fix | block. A bad case counts as caught when the verdict is not "pass";
# a good case is correct only when the verdict is "pass". Target: every bad case caught.

- id: bad-competitor
  expect: block
  brief: {id: g01, topic: Wardrobe project, photo: White wardrobe}
  option:
    caption_az: Bizim qarderoblar Embawood-dan daha keyfiyyətlidir. Fərdi ölçülərdə hazırlayırıq, bizimlə əlaqə saxlayın.
    caption_ru: Наши шкафы качественнее, чем у Embawood. Изготавливаем по индивидуальным размерам, свяжитесь с нами.
    hashtags: ["#DelFurniture", "#qarderob"]
