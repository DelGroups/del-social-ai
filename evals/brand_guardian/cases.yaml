# --- Good captions: must pass ---
- id: good-wardrobe
  expect: pass
  brief: {id: g21, topic: New custom wardrobe project, photo: White floor-to-ceiling wardrobe}
  option:
    caption_az: Məkanınızın hər bir santimetrini dəyərləndirin. Xüsusi dizaynla hazırladığımız yeni qarderob layihəmiz həm funksionallığı, həm də zərifliyi özündə birləşdirir. Siz də evinizə uyğun premium həllər axtarırsınızsa, bizimlə əlaqə saxlayın.
    caption_ru: Идеальное решение для вашего пространства. Наш новый шкаф, созданный по индивидуальному дизайну, сочетает в себе функциональность и элегантность. Если вы ищете премиальные решения для своего дома, свяжитесь с нами.
    hashtags: ["#DelFurniture", "#qarderob", "#mebel"]
- id: good-office
  expect: pass
  brief: {id: g22, topic: New office furniture project, photo: Modern office with custom desks}
  option:
    caption_az: Ofisiniz şirkətinizin vizit kartıdır. Peşəkar komandamız tərəfindən hazırlanmış yeni ofis mebeli layihəmizlə tanış olun. Uğurlu iş mühiti yaratmaq üçün fərdi dizayn təkliflərimizdən yararlanın.
    caption_ru: Ваш офис — это визитная карточка вашей компании. Ознакомьтесь с нашим новым проектом офисной мебели, созданным нашей профессиональной командой. Воспользуйтесь нашими индивидуальными дизайнерскими решениями для создания успешной рабочей среды.
    hashtags: ["#DelFurniture", "#ofismebeli", "#interyerdizayn"]
- id: good-measurement
  expect: pass
  brief: {id: g23, topic: Free professional measurement service, photo: Specialist measuring a wall with a laser meter}
  option:
    caption_az: Mükəmməl mebel dəqiq ölçüdən başlayır. Mütəxəssisimiz evinizə və ya ofisinizə gələrək ölçüləri pulsuz götürür və məkanınıza uyğun həll təklif edir. Ölçü götürmə üçün WhatsApp-a yazın.
    caption_ru: Идеальная мебель начинается с точных замеров. Наш специалист бесплатно приедет к вам домой или в офис, снимет размеры и предложит решение для вашего пространства. Напишите нам в WhatsApp, чтобы договориться о замере.
    hashtags: ["#DelFurniture", "#mebel"]
