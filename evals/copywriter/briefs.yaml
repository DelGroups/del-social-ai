# Copywriter eval briefs for Del Furniture (docs/phase-1-plan.md §10).
# Each brief goes through Copywriter -> Brand Guardian (max 2 revisions); a human rates the 3 options.
# Success: at least one option publishable as is. Target: >= 80% of briefs.
# Fields: see del_social/agents/common.py Brief. "review_hint" is for the human reviewer only; the agents never see it.

